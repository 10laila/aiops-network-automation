---
- name: Afficher les VLANs sur sw2
  hosts: sw2
  gather_facts: false
  tasks:
    - name: Recuperer les VLANs avec show vlan brief
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output

    - name: Afficher le resultat des VLANs
      ansible.builtin.debug:
        var: vlan_output.stdout_lines[0]